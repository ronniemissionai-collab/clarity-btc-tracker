# Daily data refresh (build ticket 11): runs the eight-step ingest/compute
# pipeline and commits data/ (+ the resumable state/ ledgers) on success.
# On any failure - validation gate included - data/ is left untouched, the
# machine-readable failure report is uploaded as an artifact, and a tracking
# issue is created (or updated, if one is already open).
name: refresh

on:
  schedule:
    - cron: "23 9 * * *" # 09:23 UTC daily - off the :00 GitHub cron rush
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PDF tooling (pdftotext + tesseract for scanned filings)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install dependencies
        run: npm ci

      - name: Run the pipeline
        run: npm run pipeline
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Commit refreshed data (skip when nothing changed)
        if: success()
        run: |
          git config user.name "clarity-bot"
          git config user.email "clarity-bot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No data changes today - skipping the commit."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-report
          path: state/failure-report.json
          if-no-files-found: warn

      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Daily refresh failed - last good data is still being served";
            let report = "(no failure report was written - see the workflow log)";
            try {
              report = fs.readFileSync("state/failure-report.json", "utf8");
            } catch {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled data refresh failed on ${new Date().toISOString()}.`,
              "",
              "data/ was left untouched - the site keeps serving the last validated data.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Failure report (`state/failure-report.json`):",
              "",
              "```json",
              report.trim(),
              "```",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
              per_page: 1,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pipeline-failure"],
              });
            }
